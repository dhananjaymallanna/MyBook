---
layout: default
---

{% if page.title %}
  <header class="page-heading">
    <p class="eyebrow">Uncoding / Guide</p>
    <h1 id="{{ page.id }}" class="page-title">{{ page.title | escape }}</h1>
  </header>
{% endif %}
{% if page.subtitle %}
  <div class="page-subtitle">{{ page.subtitle | escape }}</div>
{% endif %}

<section class="article-content markdown-section">
  {{ content }}
</section>
